AllCops:
  TargetRubyVersion: 4.0
  DisabledByDefault: true
  NewCops: disable
  Exclude:
    - "gems/**/*"
    - "vendor/**/*"

Bundler:
  Enabled: true

Gemspec:
  Enabled: true

Layout:
  Enabled: true
Layout/LineLength:
  Enabled: false
# 引数・ハッシュの折り返しは、開き括弧の位置に揃えず行頭から一定量だけ
# インデントする。括弧位置に揃えると引数が深くまで押し出されて読みにくいため。
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/HashAlignment:
  EnforcedHashRocketStyle: key
  EnforcedColonStyle: key
# 複数行にまたがるメソッド呼び出しの継続行も、他の折り返し（FirstArgumentIndentation等）
# と同じく呼び出し先頭の位置に揃えず、一定量だけインデントする。
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Lint:
  Enabled: true
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
# RSpec.describe ブロック内でのフィクスチャ定数定義は一般的なパターンのため対象外にする。
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

Metrics:
  Enabled: false

Migration:
  Enabled: false

Naming:
  Enabled: true

Security:
  Enabled: true

Style:
  Enabled: true
Style/FrozenStringLiteralComment:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/TrailingCommaInArguments:
  Enabled: false
Style/TrailingCommaInArrayLiteral:
  Enabled: false
Style/TrailingCommaInHashLiteral:
  Enabled: false
Style/SymbolArray:
  EnforcedStyle: brackets
Style/NumericLiterals:
  Enabled: false
Style/WordArray:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/BarePercentLiterals:
  Enabled: false
Style/Lambda:
  EnforcedStyle: literal
# %<name>s のような名前付きトークンは要求しない。%s/%04d 等の位置指定のままでよい。
Style/FormatStringToken:
  EnforcedStyle: unannotated

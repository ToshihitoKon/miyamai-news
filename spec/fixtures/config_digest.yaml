# pipeline.mode: digest の最小構成。voicepeak/mixer/assets を持たない
# fixture で、Config.validate_for!("digest") が通ることを検証する。
pipeline:
  mode: digest

cloudflare:
  account_id: test-account-id
  worker_name: miyamai-news-test
  bucket: test-bucket
  public_base: https://news.example.com
  retention_episodes: 5

ai_agent:
  bin: claude
  model: claude-opus-4-8
  effort: xhigh
  selector_model: claude-sonnet-5
  extractor_model: claude-opus-4-8

program_details:
  total_news_count: 8
  categories:
    - label: "生成AI"
      description: "LLM・生成AIモデルそのものに関する話題。"

collect:
  lookback_hours: 24
  retention_days: 30
  fetch_threads: 5
  fetch_retry_timeout_sec: 300
  fetch_retry_base_sec: 2
  fetch_retry_max_interval_sec: 10
  fetch_failure_abort_threshold: 3

rss_feed_sources:
  - name: "Hacker News (AI)"
    url: "https://hnrss.org/newest?q=AI&points=50"
